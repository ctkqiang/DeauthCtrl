org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 --add-opens=java.base/java.util=ALL-UNNAMED
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# ── 构建稳定性(2026-11-21) ──────────────────────────────────────────
# terminal-emulator / terminal-view 的 classes.jar 在 :app 的 Kotlin 编译
# 阶段被并发/增量读取时报 FileAnalysisException(「Internal compiler error」),
# 表现为随机、难复现。关闭并行与 Kotlin 增量后稳定复现清零。
# 代价:构建略慢;稳定性优先。
org.gradle.parallel=false
kotlin.incremental=false
